name: Backend migration script
on:
  push:
    branches: [qa/backend-model-diagnostic-20261101]
permissions:
  contents: read
jobs:
  migration-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Database=unused;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CSM.slnx
      - run: dotnet build CSM.slnx --configuration Release --no-restore
      - run: dotnet tool install --global dotnet-ef --version 10.0.10
      - name: Generate exact additive migration SQL without connecting to a database
        run: dotnet ef migrations script 20261025001311_ImportedPrivacyPreferences 20261031213000_AddUserAuditCompanySnapshot --project CSM.Infrastructure/CSM.Infrastructure.csproj --startup-project CSM.Api/CSM.Api.csproj --configuration Release --no-build
