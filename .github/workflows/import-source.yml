name: Import CSM source

on:
  push:
    paths:
      - csm-source.zip
      - .github/workflows/import-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        shell: bash
        run: |
          if [ ! -f csm-source.zip ]; then
            echo "Archive already unpacked."
            exit 0
          fi
          unzip -o csm-source.zip
          rm csm-source.zip
      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import CSM web application source"
          git push
