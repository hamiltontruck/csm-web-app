name: Vercel container builds

on:
  push:
    branches: [main]
    paths:
      - 'CSM.*/**'
      - 'deploy/vercel/**'
      - 'Dockerfile.vercel.*'
      - 'vercel.json'
      - '.dockerignore'
      - '.github/workflows/vercel-containers.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CSM.*/**'
      - 'deploy/vercel/**'
      - 'Dockerfile.vercel.*'
      - 'vercel.json'
      - '.dockerignore'
      - '.github/workflows/vercel-containers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Vercel ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build with the Dockerfile directory as context, matching Vercel
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          dockerfile=$(python3 -c 'import json, os; print(json.load(open("vercel.json"))["services"][os.environ["SERVICE"]]["entrypoint"])')
          docker build --file "$dockerfile" --tag "csm-vercel-${SERVICE}:check" "$(dirname "$dockerfile")"
