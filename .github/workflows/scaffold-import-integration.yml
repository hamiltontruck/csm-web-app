name: Scaffold imported feature migration
on:
  push:
    branches: [fix/pr49-feature-integration]
    paths: [.github/workflows/scaffold-import-integration.yml]
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef --version 10.0.10
      - run: dotnet ef migrations add ImportedPrivacyPreferences --project CSM.Infrastructure/CSM.Infrastructure.csproj --startup-project CSM.Api/CSM.Api.csproj --output-dir Persistence/Migrations
      - name: Export generated source for review
        shell: python
        run: |
          import pathlib, json
          root = pathlib.Path("CSM.Infrastructure/Persistence/Migrations")
          files = list(root.glob("*ImportedPrivacyPreferences*.cs")) + [root / "ApplicationDbContextModelSnapshot.cs"]
          assert len(files) == 3
          for path in files:
              data = path.read_text()
              chunks = [data[i:i+2000] for i in range(0,len(data),2000)]
              for index, part in enumerate(chunks):
                  print("CSM_FILE " + json.dumps({"path":str(path),"index":index,"data":part}))
              print("CSM_FILE_DONE " + json.dumps({"path":str(path),"count":len(chunks),"length":len(data)}))
