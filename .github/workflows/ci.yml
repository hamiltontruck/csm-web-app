name: CSM CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .NET 10 solution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: dotnet restore CSM.sln

      - name: Build solution
        run: dotnet build CSM.sln --configuration Release --no-restore

      - name: Install Entity Framework CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - name: Build SQL Server migration bundles
        run: |
          mkdir -p artifacts/csm-db-migrate/linux artifacts/csm-db-migrate/windows
          dotnet restore CSM.sln --runtime linux-x64
          dotnet ef migrations bundle --project CSM.Infrastructure/CSM.Infrastructure.csproj --startup-project CSM.Api/CSM.Api.csproj --configuration Release --self-contained --runtime linux-x64 --output artifacts/csm-db-migrate/linux/csm-db-migrate
          dotnet restore CSM.sln --runtime win-x64
          dotnet ef migrations bundle --project CSM.Infrastructure/CSM.Infrastructure.csproj --startup-project CSM.Api/CSM.Api.csproj --configuration Release --self-contained --runtime win-x64 --output artifacts/csm-db-migrate/windows/csm-db-migrate.exe

      - name: Upload SQL migration bundles
        uses: actions/upload-artifact@v4
        with:
          name: csm-db-migration-bundles-${{ github.sha }}
          path: artifacts/csm-db-migrate/
          if-no-files-found: error
          retention-days: 14

      - name: Validate Docker Compose
        run: docker compose config --quiet
        env:
          CSM_SA_PASSWORD: CiOnly-StrongPassword-2026!
          CSM_JWT_SECRET: ci-only-jwt-secret-with-more-than-32-characters
