name: CSM CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .NET 10 solution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: dotnet restore CSM.sln

      - name: Build solution
        run: dotnet build CSM.sln --configuration Release --no-restore

      - name: Validate Docker Compose
        run: docker compose config --quiet
        env:
          CSM_SA_PASSWORD: CiOnly-StrongPassword-2026!
          CSM_JWT_SECRET: ci-only-jwt-secret-with-more-than-32-characters
