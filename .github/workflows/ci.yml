name: CSM CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .NET 10 solution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: dotnet restore CSM.sln

      - name: Build solution
        run: dotnet build CSM.sln --configuration Release --no-restore

      - name: Run infrastructure tests
        env:
          CSM_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
        run: dotnet test CSM.Infrastructure.Tests/CSM.Infrastructure.Tests.csproj --configuration Release --no-restore

      - name: Install Entity Framework CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - name: Check PostgreSQL migrations match the model
        run: dotnet ef migrations has-pending-model-changes --project CSM.Infrastructure/CSM.Infrastructure.csproj --startup-project CSM.Api/CSM.Api.csproj

      - name: Validate Docker Compose
        run: docker compose config --quiet
        env:
          CSM_DATABASE_URL: Host=ep-ci.eu-central-1.aws.neon.tech;Database=neondb;Username=neondb_owner;Password=ci-only;SSL Mode=Require;Channel Binding=Require
          CSM_JWT_SECRET: ci-only-jwt-secret-with-more-than-32-characters
          CSM_BOOTSTRAP_EMAIL: ci@example.com
          CSM_BOOTSTRAP_PASSWORD: CiOnly-StrongPassword-2026!
