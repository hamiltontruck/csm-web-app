name: Equipment site migration SQL
on:
  push:
    branches: [qa/equipment-site-migration-20261102]
permissions:
  contents: read
jobs:
  script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5a5f88df86c83b1ac6f07072afcec012f2cff1a
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef --version 10.0.10
      - run: dotnet restore CSM.Api/CSM.Api.csproj
      - name: Generate reviewed migration SQL without a database connection
        run: |
          dotnet ef migrations script 20261031213000_AddUserAuditCompanySnapshot 20261102212000_AddEquipmentMaintenanceSiteSnapshot --project CSM.Infrastructure/CSM.Infrastructure.csproj --startup-project CSM.Api/CSM.Api.csproj --output site-migration.sql
          cat site-migration.sql
      - uses: actions/upload-artifact@v4
        with:
          name: equipment-site-migration-sql
          path: site-migration.sql
