name: SuperAdmin companyless browser regressions

on:
  pull_request:
    branches: [main]
    paths:
      - 'CSM.Web/**'
      - 'CSM.Api/**'
      - 'CSM.Application/**'
      - 'CSM.Domain/**'
      - 'CSM.Infrastructure/**'
      - 'scripts/qa/superadmin-company-context.cjs'
      - 'scripts/qa/equipment-timesheets.cjs'
      - '.github/workflows/superadmin-browser-regression.yml'
  push:
    branches: [main]
    paths:
      - 'CSM.Web/**'
      - 'CSM.Api/**'
      - 'CSM.Application/**'
      - 'CSM.Domain/**'
      - 'CSM.Infrastructure/**'
      - 'scripts/qa/superadmin-company-context.cjs'
      - 'scripts/qa/equipment-timesheets.cjs'
      - '.github/workflows/superadmin-browser-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companyless-superadmin-browser:
    name: Companyless SuperAdmin browser fixtures
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Blazor application
        run: dotnet build CSM.Web/CSM.Web.csproj --configuration Release
      - name: Install pinned browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Test companyless SuperAdmin company selectors
        run: node scripts/qa/superadmin-company-context.cjs
      - name: Test companyless SuperAdmin equipment timesheets
        run: node scripts/qa/equipment-timesheets.cjs
