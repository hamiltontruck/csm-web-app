services:
  api:
    build:
      context: .
      dockerfile: CSM.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: "${CSM_DATABASE_URL:?Set CSM_DATABASE_URL}"
      Database__ApplyMigrationsOnStartup: "true"
      BootstrapAdmin__Email: ${CSM_BOOTSTRAP_EMAIL:?Set CSM_BOOTSTRAP_EMAIL}
      BootstrapAdmin__Password: ${CSM_BOOTSTRAP_PASSWORD:?Set CSM_BOOTSTRAP_PASSWORD}
      Jwt__Issuer: CSM.Api
      Jwt__Audience: CSM.Client
      Jwt__SecretKey: ${CSM_JWT_SECRET:?Set CSM_JWT_SECRET}
      Cors__AllowedOrigins__0: ${CSM_WEB_ORIGIN:-http://localhost:8080}
    ports:
      - "5065:8080"

  web:
    build:
      context: .
      dockerfile: CSM.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ApiSettings__BaseUrl: ${CSM_API_BASE_URL:-http://api:8080/api/}
      ApiSettings__PublicBaseUrl: ${CSM_PUBLIC_API_BASE_URL:-http://localhost:5065/api/}
    depends_on:
      - api
    ports:
      - "8080:8080"
