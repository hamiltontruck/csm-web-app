services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${CSM_SA_PASSWORD:?Set CSM_SA_PASSWORD}
    volumes:
      - csm_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: CSM.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Server=database,1433;Database=CSM_DB;User Id=sa;Password=${CSM_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True
      Jwt__Issuer: CSM.Api
      Jwt__Audience: CSM.Client
      Jwt__SecretKey: ${CSM_JWT_SECRET:?Set CSM_JWT_SECRET}
      Cors__AllowedOrigins__0: ${CSM_WEB_ORIGIN:-http://localhost:8080}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5065:8080"

  web:
    build:
      context: .
      dockerfile: CSM.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ApiSettings__BaseUrl: ${CSM_API_BASE_URL:-http://api:8080/api/}
      ApiSettings__PublicBaseUrl: ${CSM_PUBLIC_API_BASE_URL:-http://localhost:5065/api/}
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  csm_sql_data:
